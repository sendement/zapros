[package]
name = "zapros"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "SQL IDE for Oracle, PostgreSQL, ClickHouse and SQLite"

[features]
default = ["oracle"]
oracle = ["dep:oracle"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
egui_plot = "0.37"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
futures-util = "0.3"
postgres-native-tls = "0.5"
native-tls = "0.2"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
oracle = { version = "0.6", optional = true, features = ["chrono"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
base64 = "0.22"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
calamine = { version = "0.37", default-features = false, features = ["chrono"] }
csv = "1.4"
encoding_rs = "0.8"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
